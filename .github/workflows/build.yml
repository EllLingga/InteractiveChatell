AAAname: Build ItemChat

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Maven (auto-retry on corrupted download)
        run: |
          mvn -B -U package --file pom.xml || (
            echo "Build failed, likely due to a corrupted downloaded dependency. Clearing local repo and retrying..."
            rm -rf ~/.m2/repository
            mvn -B -U package --file pom.xml
          )

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: ItemChat-plugin
          path: target/ItemChat.jar
