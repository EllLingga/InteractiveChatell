name: ItemChat
version: '1.0.0'
main: com.rian.itemchat.ItemChatPlugin
api-version: '1.20'
author: You
description: Chat item/inventory/position preview like InteractiveChat, with DiscordSRV relay.
softdepend: [DiscordSRV]

commands:
  itemchat:
    description: Internal command used by ItemChat's clickable chat links
    usage: /itemchat <view|pos> <token>

permissions:
  itemchat.use:
    description: Allows using [i]/[item]/[inv]/[pos] tags in chat
    default: true
